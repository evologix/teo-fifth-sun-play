<style>html,body{margin:0;height:100%;background:#07050d;overflow:hidden;overscroll-behavior:none;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-text-size-adjust:100%}#game{width:100%;height:100%}
#pad{position:fixed;inset:0;pointer-events:none;z-index:10;user-select:none;-webkit-user-select:none}
.btn{position:absolute;bottom:4vh;width:15vmin;height:15vmin;min-width:84px;min-height:84px;border-radius:50%;pointer-events:auto;touch-action:none;
background:rgba(255,220,150,.22);border:3px solid rgba(255,235,190,.55);color:rgba(255,245,220,.9);font:bold 5vmin Georgia,serif;
display:flex;align-items:center;justify-content:center;box-sizing:border-box;-webkit-tap-highlight-color:transparent;cursor:pointer}
.btn.on{background:rgba(255,190,80,.5)}
.hbtn{position:absolute;top:calc(2vh + 64px);display:none;align-items:center;justify-content:center;height:7vmin;min-height:40px;padding:0 2.2vmin;border-radius:3vmin;pointer-events:auto;touch-action:manipulation;
background:rgba(255,220,150,.18);border:2px solid rgba(255,235,190,.5);color:rgba(255,245,220,.9);font:bold 2.6vmin Georgia,serif;min-width:64px;box-sizing:border-box;-webkit-tap-highlight-color:transparent;cursor:pointer}
.hbtn.on{background:rgba(255,190,80,.5)}.hbtn.flash{background:rgba(255,255,255,.6)}
#bTilt{top:auto;bottom:calc(4vh + 4vmin);left:50%;transform:translateX(-50%);height:9vmin;min-height:52px;padding:0 4vmin;font-size:3.6vmin;background:rgba(40,20,5,.6);border:3px solid #ffd860;color:#ffe9a0}#bCentre{top:auto;bottom:calc(4vh + 4vmin);left:calc(50% + 14vmin);height:9vmin;min-height:52px;min-width:52px;font-size:4vmin}
body.tilting #bL,body.tilting #bR{opacity:.25}
#tiltPrompt{position:absolute;top:12vh;left:50%;transform:translateX(-50%);display:none;pointer-events:auto;padding:1.5vmin 3vmin;border-radius:2vmin;background:rgba(20,10,5,.75);border:2px solid rgba(255,220,150,.6);color:#ffe9c0;font:bold 3vmin Georgia,serif;cursor:pointer}
#rotate{position:fixed;inset:0;z-index:50;display:none;background:#07050d;color:#ffe9c0;font:bold 6vmin Georgia,serif;align-items:center;justify-content:center;text-align:center;flex-direction:column}
body.portrait #rotate{display:flex}
.hbtn.bad{background:rgba(200,60,40,.55)}
#bTilt.on{background:rgba(255,190,40,.75);border-color:#ffd860;color:#2a1600}
body.menu #pad{display:none}body.capture #pad,body.capture #bMute,body.capture #bVol,body.capture #volPanel,body.capture #rotate{display:none!important}
#bVol{position:fixed;z-index:20;top:calc(2vh + 64px);right:calc(3vw + 15vmin + 50px + 11vmin);display:flex}body.menu #bVol{right:calc(3vw + 11vmin);top:2vh}
#volPanel{position:fixed;z-index:21;display:none;top:calc(2vh + 64px + 8vmin);right:calc(3vw + 15vmin + 50px);background:rgba(30,15,5,.85);border:2px solid #d8a85a;border-radius:2vmin;padding:1.5vmin 2.5vmin;color:#ffe9c0;font:bold 2.4vmin Georgia,serif;flex-direction:column;gap:1vmin}body.menu #volPanel{right:3vw;top:calc(2vh + 8vmin)}#volPanel.open{display:flex}#volPanel label{display:flex;align-items:center;gap:1.5vmin;justify-content:space-between}#volPanel input{width:22vmin;min-width:110px}
#bMute{position:fixed;z-index:20;top:calc(2vh + 64px);right:calc(3vw + 15vmin + 50px);display:flex}
body.menu #bMute{right:3vw;top:2vh}
@font-face{font-family:Cinzel;src:url(assets/fonts/Cinzel.ttf) format('truetype');font-weight:400 900;font-display:block}
#bL{left:3vw}#bR{left:calc(3vw + 18vmin)}#bF{right:calc(3vw + 18vmin)}#bJ{right:3vw}</style>
</head><body><div id="game"></div>
<div id="pad"><div class="btn" id="bL" data-k="left">&#9664;</div><div class="btn" id="bR" data-k="right">&#9654;</div><div class="btn" id="bF" data-k="fire" style="font-size:3.4vmin">FIRE</div><div class="btn" id="bJ" data-k="jump" style="font-size:3.4vmin">JUMP</div><div class="hbtn" id="bCentre" title="Recalibrate tilt">&#8853;</div><div class="hbtn" id="bTilt" title="Tilt to roll">TILT</div><div id="tiltPrompt">Tap to enable tilt</div></div>
<div class="hbtn" id="bMute" title="Mute (M)">&#128266;</div><div class="hbtn" id="bVol" title="Sound balance">&#9835;</div>
